version: 2
updates:
  # The lockfiles were pinned and reproducible but nothing kept them fresh -
  # "keep dependencies updated" was a SECURITY.md rule with no enforcement.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Work branches off `railway`, never `main` (see .github/workflows/branch-guard.yml).
    target-branch: railway
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    target-branch: railway
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: railway
    labels:
      - dependencies
