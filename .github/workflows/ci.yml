name: CI

on:
  pull_request:
    branches: [railway, main]
  push:
    branches: [railway, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

  dashboard:
    name: Dashboard — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  audit:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Nothing checked the 60+ pinned Python packages against a CVE feed.
      # The lockfiles were reproducible but never audited.
      - name: pip-audit (runtime dependencies)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

      - name: npm audit (dashboard)
        working-directory: dashboard
        run: npm audit --audit-level=high

  secrets:
    name: Security — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later deleted is still in the
          # objects, and SECURITY.md's first contributor rule is "never commit
          # secrets" - which nothing was enforcing.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config:
    name: Config — compose + runtime lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A colon inside an unquoted YAML scalar silently broke the whole compose
      # file once; this catches that class before it lands.
      - name: Validate docker-compose.yml
        env:
          AIRFLOW_FERNET_KEY: ci-placeholder
          AIRFLOW_SECRET_KEY: ci-placeholder
          AIRFLOW_ADMIN_PASSWORD: ci-placeholder
        run: docker compose --profile airflow config -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CI otherwise only installs requirements-dev.txt, so a lockfile that is
      # uninstallable on Linux (platform-specific pins from a Windows compile)
      # would only surface at image build time.
      - name: Runtime lockfile resolves on Linux
        run: pip install --dry-run --report /dev/null -r requirements.txt
