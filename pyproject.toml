[project]
name = "chalk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "nba_api>=1.4.0",
    "httpx>=0.27.0",
    "google-genai>=0.8.0",
    "redis[asyncio]>=5.0.0",
    "structlog>=24.1.0",
    "mapie>=0.8.0",
]

[project.optional-dependencies]
# Training-only dependencies, deliberately NOT runtime dependencies.
#
# CLAUDE.md states plainly that MLflow is not deployed in production - models
# are committed to git and loaded from disk - yet mlflow was a hard runtime
# dependency, dragging an entire second web stack into the API image (flask,
# werkzeug, flask-cors, gunicorn, graphene, gitpython, sqlparse, pyarrow) purely
# as transitive baggage. Every one of those is CVE surface inside the running
# API for no behavioural benefit.
#
# optuna is imported only by chalk/models/tuning.py, which is reachable only
# from scripts/train_ensemble.py and its test - never from the API.
#
# Install with: pip install -e ".[training]"
training = [
    "mlflow>=2.10.0",
    "optuna>=3.6.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.9.0",
    # The tuning tests import optuna.
    "chalk[training]",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors, plus flake8-bandit ("S") for security lints.
#
# "S" was previously off, so the linter caught exactly zero security issues -
# a `# noqa: S311` suppression already existed in chalk/mlb/fetcher.py for a
# rule that was not even enabled.
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101) and hardcoded throwaway values (S105/S106).
"tests/**" = ["S101", "S105", "S106", "S311"]
# Scripts are operator-run, not request-driven.
"scripts/**" = ["S101"]

[tool.setuptools.packages.find]
include = ["chalk*"]
